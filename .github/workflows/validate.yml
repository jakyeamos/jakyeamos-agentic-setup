name: Validate workbench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python surfaces
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: Validate legacy skills
        run: python3 scripts/validate_skills.py
      - name: Validate catalog
        run: python3 scripts/validate_catalog.py
      - name: Run public safety scan
        run: python3 scripts/public_safety_check.py
      - name: Run focused tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check
